[alembic]
script_location = alembic
prepend_sys_path = .
# L'URL réelle vient de MENU_DATABASE_URL (voir alembic/env.py)
sqlalchemy.url = postgresql+psycopg2://menu:menu@localhost:5432/menu_optimizer

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
