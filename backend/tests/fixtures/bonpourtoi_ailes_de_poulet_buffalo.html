    "description": "Goûte à la meilleure recette d'ailes de poulet Buffalo!\r\nLes ailes de poulet Buffalo sont vraiment parfaites à déguster en écoutant le sport à la télévision! En plus, c'est une recette facile à préparer, pleine de saveurs et tellement facile à partager entre amis! Cela dit, si tu reçois plusieurs invités, double les portions de la recette pour ne pas en manquer.&nbsp;\r\n\r\nD'ailleurs, cette sauce Buffalo est très simple à faire. Tu pourrais même remplacer le jus de citron par du vinaigre de cidre. Dans tous les cas, du poulet cuit avec de la sauce Buffalo, c'est toujours bon!\r\nPourquoi servir les ailes Buffalo avec de la sauce au fromage bleu?\r\nEn fait, les produits laitiers composant la sauce au fromage bleu contiennent de la caséine, un type de protéine. Cette dernière s'accroche alors aux particules de capsaïcine de la sauce Buffalo et diminue la sensation de brûlure en bouche!\r\n\r\nEffectivement,&nbsp;la capsaïcine serait un irritant pour les muqueuses du corps humain, puisqu’elle agit sur les récepteurs de chaleur du système nerveux.&nbsp;",
